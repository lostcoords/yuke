name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the release
    uses: ./.github/workflows/ci.yml
    with:
      tag: ${{ github.ref_name }}

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Publish the four tested archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # A suffix before the build metadata, such as v1.2.0-rc.1, makes a prerelease.
          flags=()
          case "${RELEASE_TAG%%+*}" in *-*) flags=(--prerelease --latest=false) ;; esac
          gh release create "${RELEASE_TAG}" dist/*.tar.gz --verify-tag --title "${RELEASE_TAG}" \
            --notes "Built from commit \`${GITHUB_SHA}\`." "${flags[@]}"
