name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the release
    uses: ./.github/workflows/ci.yml
    with:
      tag: ${{ github.ref_name }}

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Read the notes of the version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # The notes are the lines after the heading `## VERSION` up to the next heading of that level.
          awk -v heading="## ${RELEASE_TAG#v}" '$0 == heading { found = 1; next } found && /^## / { exit } found' \
            CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          grep -q '[^[:space:]]' "${RUNNER_TEMP}/notes.md" || { echo "CHANGELOG.md has no section ## ${RELEASE_TAG#v}" >&2; exit 1; }
          printf '\nBuilt from commit `%s`.\n' "${GITHUB_SHA}" >> "${RUNNER_TEMP}/notes.md"
      - name: Publish the four tested archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # A suffix before the build metadata, such as v1.2.0-rc.1, makes a prerelease.
          flags=()
          case "${RELEASE_TAG%%+*}" in *-*) flags=(--prerelease --latest=false) ;; esac
          gh release create "${RELEASE_TAG}" dist/*.tar.gz --verify-tag --title "${RELEASE_TAG}" \
            --notes-file "${RUNNER_TEMP}/notes.md" "${flags[@]}"
