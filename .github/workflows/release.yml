name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One job builds every target. Zig cross-compiles all four from Linux.
  # One job also keeps the release atomic: every asset lands, or none.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout keeps the job token in .git/config by default.
          # zig build runs build.zig from the tag, which must not read it.
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2

      # --verify-tag only tests that the tag exists.
      # A force-move during the build would publish the wrong binaries.
      - name: Refuse a tag that moved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq .sha)"
          if [ "${tag_sha}" != "${GITHUB_SHA}" ]; then
            echo "::error::${GITHUB_REF_NAME} points at ${tag_sha}, this run built ${GITHUB_SHA}."
            exit 1
          fi

      # The asset name is the Zig target triple, with no version in it.
      # ../yuke-cloud/lib/install.sh builds that name; see its install-contract.
      - name: Build every target
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in \
            x86_64-linux-musl \
            aarch64-linux-musl \
            x86_64-macos \
            aarch64-macos
          do
            echo "::group::${target}"
            zig build \
              -Dtarget="${target}" \
              -Doptimize=ReleaseFast \
              -Dstrip=true \
              --prefix "build/${target}"
            tar -czf "dist/yuke-${target}.tar.gz" -C "build/${target}/bin" yuke
            echo "::endgroup::"
          done
          # No `./` prefix: the install script compares the bare asset name.
          cd dist && sha256sum yuke-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # A draft hides the release until every asset is present.
      # gh release create fails if the release exists, so a rerun clobbers.
      - name: Assemble the release as a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          if gh release view "${version}" >/dev/null 2>&1; then
            echo "release ${version} exists; hide it while the assets change"
            gh release edit "${version}" --draft=true
          else
            # A tag with a suffix, such as v0.1.0-rc1, becomes a prerelease.
            prerelease=()
            case "${version}" in *-*) prerelease=(--prerelease) ;; esac
            gh release create "${version}" \
              --draft \
              --title "${version}" \
              --generate-notes \
              --verify-tag \
              "${prerelease[@]}"
          fi
          gh release upload "${version}" dist/* --clobber

      # The first check cannot see a tag that moved during the build.
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${version}" --jq .sha)"
          if [ "${tag_sha}" != "${GITHUB_SHA}" ]; then
            echo "::error::${version} moved to ${tag_sha}; the draft stays unpublished."
            exit 1
          fi
          gh release edit "${version}" --draft=false
