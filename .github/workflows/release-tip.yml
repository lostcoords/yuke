name: Release Tip

# Fires when CI COMPLETES on main, not when main is pushed. Nothing ships that
# did not pass its tests, and the release path itself gets exercised on every
# merge -- so a tagged release is never the first time this code runs.
#
# READ THE GUARDS BELOW BEFORE CHANGING THEM. `workflow_run` grants a write
# token even when the run that triggered it had none: "The workflow started by
# the workflow_run event is able to access secrets and write tokens, even if the
# previous workflow was not." A job here that builds attacker code is a
# repository compromise, not a broken build.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# NEVER two at once. Two runs racing on the same rolling tag corrupt the assets
# of whichever finishes second, so a queued run waits instead of cancelling.
concurrency:
  group: release-tip
  cancel-in-progress: false

jobs:
  tip:
    # `branches: [main]` above is NOT sufficient on its own. It matches the
    # TRIGGERING RUN's branch, and a fork's pull request carries its own source
    # branch name -- a fork whose branch is called `main` would match it. Three
    # conditions close that:
    #
    #   event == 'push'                  a fork pull request is 'pull_request'
    #   head_repository == this repo     the code came from here, not a fork
    #   head_branch == 'main'            and from main specifically
    #
    # The dispatch path is pinned to main for the same reason: without it,
    # anyone able to dispatch could publish any branch as tip without CI.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The commit CI actually passed on, NOT whatever main points at now. Those
      # differ whenever a merge lands while this workflow is queued.
      TIP_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      # RERUNNING AN OLD CI RUN WOULD OTHERWISE ROLL TIP BACKWARD. A rerun keeps
      # the original run's sha, so `TIP_SHA` can be an ancestor of main. Without
      # this, rerunning yesterday's green run republishes yesterday's binaries
      # as tip and force-moves the tag back to them.
      #
      # tip tracks the head of main. Anything else is a stale trigger, and a
      # stale trigger is a no-op, not a failure.
      - name: Confirm this is still the head of main
        id: head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "${main_sha}" != "${TIP_SHA}" ]; then
            echo "main is at ${main_sha}, this run built ${TIP_SHA}; nothing to publish"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # Resolved through the commits API so an annotated tip tag derefs to
          # its commit; `git/ref` would return the tag object's own sha.
          # An API error here leaves `current` empty and we rebuild: wasted work
          # is the safe direction, and the alternative is skipping a real build.
          current="$(gh api "repos/${GITHUB_REPOSITORY}/commits/tip" --jq .sha 2>/dev/null || true)"
          if [ "${current}" = "${TIP_SHA}" ]; then
            echo "tip already points at ${TIP_SHA}"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - uses: mlugg/setup-zig@v2
        if: steps.head.outputs.skip == 'false'

      # Asset names carry no commit, so `--clobber` replaces them in place
      # instead of letting one file per build pile up forever. The commit lives
      # in the release title and notes.
      - name: Build every target
        if: steps.head.outputs.skip == 'false'
        run: |
          set -euo pipefail
          mkdir -p dist
          for pair in \
            "x86_64-linux-musl:linux-amd64" \
            "aarch64-linux-musl:linux-arm64" \
            "x86_64-macos:macos-amd64" \
            "aarch64-macos:macos-arm64"
          do
            target="${pair%%:*}"
            name="${pair##*:}"
            echo "::group::${name} (${target})"
            zig build \
              -Dtarget="${target}" \
              -Doptimize=ReleaseFast \
              -Dstrip=true \
              --prefix "build/${name}"
            tar -czf "dist/yuke-tip-${name}.tar.gz" -C "build/${name}/bin" yuke
            echo "::endgroup::"
          done
          cd dist && sha256sum ./*.tar.gz > SHA256SUMS

      # HIDDEN WHILE IT CHANGES. Moving the tag and replacing four assets is not
      # atomic, so an observer would otherwise see the new tag with the old
      # binaries, then a mixture as each upload lands. Draft first, and the
      # release simply disappears for the ~seconds the update takes.
      #
      # The ref moves through the API rather than `git push --force`, so the
      # checkout keeps `persist-credentials: false` and build.zig never sees a
      # write token. PATCH moves an existing ref; POST creates the first one.
      - name: Publish the tip release
        if: steps.head.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          short="${TIP_SHA:0:7}"
          notes="Rolling build of \`main\` at ${TIP_SHA}. Not a supported release.

          macOS binaries are ad-hoc signed but not notarized: after downloading
          in a browser, run \`xattr -d com.apple.quarantine <file>\`."

          if gh release view tip >/dev/null 2>&1; then
            gh release edit tip --draft=true
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/tip" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/tip" \
              -f sha="${TIP_SHA}" -F force=true >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/tip" -f sha="${TIP_SHA}" >/dev/null
          fi

          # Always a prerelease, so `gh release list` and the "Latest release"
          # badge keep pointing at the newest real version, not a rolling build.
          if gh release view tip >/dev/null 2>&1; then
            gh release edit tip --title "Tip (${short})" --notes "${notes}"
          else
            gh release create tip --draft --prerelease --verify-tag \
              --title "Tip (${short})" --notes "${notes}"
          fi

          gh release upload tip dist/* --clobber
          gh release edit tip --draft=false
