name: Release Tip

# CI must pass on main before this workflow starts. It also exercises the
# release path on every merge. The shape follows ghostty's release-tip.yml.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Two runs on one rolling tag corrupt the assets of the second run.
concurrency:
  group: release-tip
  cancel-in-progress: false

env:
  TIP_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  setup:
    # workflow_run grants a write token that the CI run did not hold.
    # `branches` matches the trigger branch, which a fork can also name main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      # paths-filter compares this commit with the tip tag.
      # A shallow clone cannot reach that tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # A rerun of an old CI run keeps the old sha.
      # Without this check, such a rerun moves tip backward.
      - name: Is this still the head of main?
        id: head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          [ "${main_sha}" = "${TIP_SHA}" ] && stale=false || stale=true
          echo "stale=${stale}" >> "${GITHUB_OUTPUT}"

      # The commits API dereferences an annotated tag to its commit.
      # An API error leaves the value empty, and then the workflow builds.
      - name: Read the current tip
        id: tip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/commits/tip" --jq .sha 2>/dev/null || true)"
          draft="$(gh release view tip --json isDraft --jq .isDraft 2>/dev/null || echo true)"
          echo "sha=${current}" >> "${GITHUB_OUTPUT}"
          echo "draft=${draft}" >> "${GITHUB_OUTPUT}"
          [ -n "${current}" ] && echo "exists=true" >> "${GITHUB_OUTPUT}" || echo "exists=false" >> "${GITHUB_OUTPUT}"

      # `build` matches every file that can change the binary.
      # `every` skips only when all changed files are inert.
      - name: Detect changes since the last tip
        id: changes
        if: github.event_name == 'workflow_run' && steps.tip.outputs.exists == 'true'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          token: ""
          base: tip
          predicate-quantifier: "every"
          filters: |
            build:
              - '**'
              - '!.github/**'
              - '!**/*.md'
              - '!LICENSE'
              - '!.gitattributes'
              - '!.gitignore'
              - '!.githooks/**'
            workflow:
              - '.github/workflows/release-tip.yml'

      # A manual dispatch always builds. It is the escape hatch.
      - name: Decide
        id: check
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          elif [ "${{ steps.head.outputs.stale }}" = "true" ]; then
            echo "main moved past ${TIP_SHA}"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          elif [ "${{ steps.tip.outputs.sha }}" = "${TIP_SHA}" ] &&
               [ "${{ steps.tip.outputs.draft }}" = "false" ]; then
            echo "tip already points at ${TIP_SHA}"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          elif [ "${{ steps.changes.outputs.build }}" = "false" ] &&
               [ "${{ steps.changes.outputs.workflow }}" = "false" ]; then
            echo "only inert files changed since the last tip"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi


  # The build uploads an artifact, not a release asset. The release stays
  # untouched until every target succeeds, so a failed leg hides nothing.
  build:
    needs: setup
    if: needs.setup.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-macos
          - aarch64-macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2

      # The asset name is the Zig target triple, the same as a tagged release.
      # ../yuke-cloud/lib/install.sh builds that name; see its install-contract.
      - name: Build ${{ matrix.target }}
        run: |
          set -euo pipefail
          zig build \
            -Dtarget=${{ matrix.target }} \
            -Doptimize=ReleaseFast \
            -Dstrip=true \
            --prefix out
          tar -czf "yuke-${{ matrix.target }}.tar.gz" -C out/bin yuke

      # Artifact storage is free on a public repository.
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: tip-${{ matrix.target }}
          path: yuke-${{ matrix.target }}.tar.gz
          retention-days: 1

  publish:
    needs: [setup, build]
    if: needs.setup.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: tip-*
          merge-multiple: true
          path: dist

      # No `./` prefix: the install script compares the bare asset name.
      - name: Checksum the assets
        run: cd dist && sha256sum yuke-*.tar.gz > SHA256SUMS && cat SHA256SUMS

      # --target is set on both paths. gh release edit keeps the old commit
      # otherwise, and an orphaned draft would then publish the wrong tag.
      - name: Open the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          short="${TIP_SHA:0:7}"
          notes="Rolling build of \`main\` at ${TIP_SHA}. Not a supported release.

          The macOS binaries have an ad-hoc signature, but no notarization.
          After a browser download, run \`xattr -d com.apple.quarantine <file>\`."
          if gh release view tip >/dev/null 2>&1; then
            gh release edit tip --draft=true --target "${TIP_SHA}" \
              --title "Tip (${short})" --notes "${notes}"
          else
            # A draft creates its tag at publication, so the first tip needs none.
            gh release create tip --draft --prerelease --target "${TIP_SHA}" \
              --title "Tip (${short})" --notes "${notes}"
          fi
          gh release upload tip dist/* --clobber

      # The API moves the tag, so no checkout here holds a write credential.
      # A draft carries the commit through --target, so only an old tag moves.
      - name: Move the tip tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/tip" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/tip" \
              -f sha="${TIP_SHA}" -F force=true >/dev/null
          fi

      # The check in setup cannot see a merge that landed during the build.
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "${main_sha}" != "${TIP_SHA}" ]; then
            echo "::notice::main moved to ${main_sha}; the draft stays unpublished."
            exit 0
          fi
          gh release edit tip --draft=false
