name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The action reads minimum_zig_version from build.zig.zon.
      # It also keeps the Zig cache between runs.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2

      - name: Check formatting
        run: zig fmt --check .

      # This step also covers test-js and check-schema. See build.zig.
      # The tests write to stderr, so a pass also prints "failed command".
      - name: Test
        run: zig build test --test-timeout 2m --summary all

  # zig build does not run tsc, so this job checks the JavaScript types and the generated plugin declarations.
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: node npm:typescript

      - name: Type-check
        run: mise run check-ts

      # A change to the plugin API must commit the regenerated declarations.
      - name: Check the plugin declarations
        run: mise run types && git add --intent-to-add src/js/app/generated && git diff --exit-code src/js/app/generated

  # Only this job runs the macOS code. Ten files branch on the host system.
  # zio selects kqueue there, and lib/term/tty_posix.zig has a Darwin path.
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2

      - name: Test
        run: zig build test --test-timeout 2m --summary all

  # Debug, not ReleaseFast. This gate finds a target that does not compile.
  # The release builds the optimized binaries. Windows is not a target.
  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-macos
          - aarch64-macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2

      - name: Build ${{ matrix.target }}
        run: zig build -Dtarget=${{ matrix.target }}
