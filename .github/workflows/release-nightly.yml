name: Release Nightly

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-nightly
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      # CI built and tested these archives with the nightly version, so the nightly builds nothing.
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Publish the four tested nightly archives and their checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          # The installer checks the archive of its platform against this file.
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          # The first nightly has no release to delete.
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/*.tar.gz dist/SHA256SUMS --target "${RELEASE_COMMIT}" --prerelease --latest=false \
            --title "Nightly (${RELEASE_COMMIT::12})" --notes "Built from commit \`${RELEASE_COMMIT}\`."
