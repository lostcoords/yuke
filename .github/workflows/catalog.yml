name: Catalog

# catalog.yuke.sh syncs from models.dev each hour and holds no GitHub credential, so this repository polls it.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: mise exec -- crates/ai/scripts/generate-catalog.sh

      # A pull request from GITHUB_TOKEN starts no CI, so the App opens it.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          client-id: ${{ vars.CATALOG_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CATALOG_BOT_PRIVATE_KEY }}

      # One fixed branch keeps one pull request. Without a diff, delete-branch closes it.
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: pull-request
        with:
          token: ${{ steps.token.outputs.token }}
          branch: bot/catalog
          delete-branch: true
          sign-commits: true
          add-paths: crates/ai/src/catalog/generated.rs
          commit-message: 'chore(ai): update the catalog'
          title: 'chore(ai): update the catalog'
          body: Generated from https://catalog.yuke.sh/v1/catalog?executable=true.

      # The number is set only while a pull request is open. The ruleset holds the merge until CI passes.
      - if: steps.pull-request.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: gh pr merge "${{ steps.pull-request.outputs.pull-request-number }}" --auto --rebase --repo "$GITHUB_REPOSITORY"
