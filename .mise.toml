[tools]
zig = "0.16.0"
"npm:typescript" = "7.0.2"

[tasks.install-local]
description = "Build yuke and link it into the local user bin directory"
run = "./tools/install-local.sh"

[tasks.check-ts]
description = "Type-check the TUI JavaScript and generated protocol contract"
run = ["tsc -p src/js/app/tsconfig.json --noEmit", "tsc -p bench/tsconfig.json --noEmit", "tsc -p tools/protogen/tsconfig.json --noEmit"]
