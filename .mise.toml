[tools]
rust = { version = "1.100.0", components = "clippy,rustfmt,rust-docs,rust-analyzer,rust-src" }
# The release holds a static tsc binary, so the check needs no Node.
"github:microsoft/TypeScript" = { version = "7.0.2", bin_path = "lib", strip_components = 1 }
# Biome checks the format and the lint rules of the TypeScript. It is one static binary.
biome = "2.5.15"

[tasks.package]
description = "Build an installation archive with its library files"
run = "python3 tools/package.py"

[tasks."package:test"]
description = "Test a package and its installer with an isolated home"
run = "python3 tools/test-package.py"

[tasks."package:test-builder"]
description = "Test the package version rules"
run = "python3 tools/test-builder.py"

[tasks.check]
description = "Run every check that a change must pass"
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --all-targets --all-features -- -D warnings",
  "cargo test --all-features",
  "RUSTDOCFLAGS=-Dwarnings cargo doc --no-deps --all-features",
  "tsc -p crates/js/tsconfig.json",
  "tsc -p docs/tsconfig.json",
  "cargo run --package yuke -- test docs/tests",
  "biome ci --error-on-warnings",
  # Build each crate with its own features only, so a feature that another crate turns on hides no gap.
  'for manifest in crates/*/Cargo.toml; do cargo check --manifest-path "$manifest" --all-targets; done',
]
