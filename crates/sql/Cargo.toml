[package]
name = "yuke-sql"
version = "0.0.1-dev"
description = "Typed SQLite queries for the code that yuke-sqlgen generates."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# With `fallible_uint`, rusqlite binds and reads `u64` and `usize`. A value above `i64::MAX` fails.
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }

[lints]
workspace = true
