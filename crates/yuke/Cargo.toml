[package]
name = "yuke"
version = "0.0.1-dev"
description = "The yuke coding agent."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53", features = ["io-std", "io-util", "macros", "net", "rt", "signal", "sync", "time"] }
yuke-agent = { path = "../agent" }
yuke-ai = { path = "../ai" }
yuke-engine = { path = "../engine" }
yuke-js = { path = "../js" }
yuke-protocol = { path = "../protocol" }
yuke-store = { path = "../store" }

[dev-dependencies]
bytes = "1.12"
# The login tests pause the clock of tokio.
tokio = { version = "1.53", features = ["test-util"] }
yuke-testing = { path = "../testing" }

[lints]
workspace = true
