[package]
name = "yuke-ai"
version = "0.0.1-dev"
description = "Provider-neutral model calls over three wire protocols."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["http"]
# Derive the TypeScript declarations of the serde types through ts-rs. The binding test of yuke-protocol turns it on.
ts = ["dep:ts-rs"]
# Implement `Transport` and `Exchange` for the `yuke-http` client. The client uses HTTP/1.1 with tokio and rustls.
http = ["dep:yuke-http"]

[dependencies]
bytes = "1.12"
memchr = "2.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ts-rs = { version = "12.0.1", optional = true }
yuke-http = { path = "../http", optional = true }

[dev-dependencies]
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
yuke-http = { path = "../http", features = ["testing"] }

[lints]
workspace = true

[[example]]
name = "oneshot"
required-features = ["http"]

[[example]]
name = "chat"
required-features = ["http"]

[[example]]
name = "tools"
required-features = ["http"]
