[package]
name = "yuke-ai"
version = "0.0.1-dev"
description = "Provider-neutral model calls over three wire protocols."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ai", "llm", "anthropic", "openai", "streaming"]
categories = ["artificial-intelligence", "api-bindings", "asynchronous"]
# The catalog scripts run only in this repository.
exclude = ["scripts/"]

[features]
default = ["http"]
# Derive the TypeScript declarations of the serde types through ts-rs. The binding test of yuke-protocol turns it on.
ts = ["dep:ts-rs"]
# Implement `Transport` and `Exchange` for the `yuke-http` client. The client uses HTTP/1.1 with tokio and rustls.
http = ["dep:yuke-http"]
# A transport and an exchange that answer with scripted replies, for tests.
scripted = []

[dependencies]
base64 = "0.23.1"
bytes = "1.12"
memchr = "2.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ts-rs = { version = "12.0.1", optional = true }
yuke-http = { path = "../http", version = "0.0.1-dev", optional = true }

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt"] }
yuke-http = { path = "../http", features = ["testing"] }

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["http", "scripted"]

[[example]]
name = "oneshot"
required-features = ["http"]

[[example]]
name = "chat"
required-features = ["http"]

[[example]]
name = "tools"
required-features = ["http"]

[[example]]
name = "custom_target"
required-features = ["http"]
