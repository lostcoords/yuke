[package]
name = "yuke-js"
version = "0.0.1-dev"
description = "The JavaScript runtime of yuke: QuickJS as a local tokio task, with TypeScript modules and tools."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
# clipboard-rs reads the image of the clipboard on macOS (PNG or TIFF), X11, and Wayland. `to_png` encodes it.
clipboard-rs = { version = "0.3.5", default-features = false, features = ["image", "wayland"] }
# oxc makes a breaking release each week, so each crate pins one exact version. The cache key holds this file too.
oxc_allocator = "=0.153.0"
oxc_codegen = { version = "=0.153.0", default-features = false }
oxc_parser = "=0.153.0"
oxc_semantic = "=0.153.0"
oxc_span = "=0.153.0"
oxc_transformer = "=0.153.0"
rquickjs = { version = "0.14.0", default-features = false, features = ["std", "classes", "futures", "loader", "macro"] }
sha2 = { version = "0.11.0", default-features = false }
# rustix sends process group signals and shuts down sockets through safe system calls.
rustix = { version = "1.1", default-features = false, features = ["std", "net", "process"] }
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "process", "rt", "sync", "test-util", "time"] }
# url gives `URL` and `URLSearchParams` the WHATWG parser. Its IDNA back end is ICU4X (idna_adapter 1.2).
url = "2.5.8"
yuke-agent = { path = "../agent" }
yuke-ai = { path = "../ai", default-features = false }
yuke-engine = { path = "../engine" }
yuke-http = { path = "../http" }
yuke-protocol = { path = "../protocol" }
yuke-term = { path = "../term" }

[build-dependencies]
# build.rs strips and compiles the built-in modules with the same versions as the runtime.
oxc_allocator = "=0.153.0"
oxc_codegen = { version = "=0.153.0", default-features = false }
oxc_parser = "=0.153.0"
oxc_semantic = "=0.153.0"
oxc_span = "=0.153.0"
oxc_transformer = "=0.153.0"
rquickjs = { version = "0.14.0", default-features = false, features = ["std", "loader"] }

[dev-dependencies]
yuke-http = { path = "../http", features = ["testing"] }
yuke-testing = { path = "../testing" }

[lints]
workspace = true
