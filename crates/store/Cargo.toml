[package]
name = "yuke-store"
version.workspace = true
description = "A file store for the sessions of yuke-agent."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-trait = "0.1.92"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53", features = ["sync"] }
yuke-agent = { path = "../agent" }
yuke-protocol = { path = "../protocol" }
yuke-ai = { path = "../ai", default-features = false }
yuke-engine = { path = "../engine" }

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt"] }
yuke-agent = { path = "../agent", features = ["testing"] }
yuke-testing = { path = "../testing" }

[[test]]
name = "processes"
harness = false

[lints]
workspace = true
