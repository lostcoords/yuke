[package]
name = "engine"
version = "0.0.1-dev"
description = "Conversation execution through model and tool calls."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ai = { path = "../ai", default-features = false }
async-trait = "0.1.92"
fastrand = "2.5.0"
tokio-util = "0.7.19"

[dev-dependencies]
ai = { path = "../ai", features = ["http-tokio"] }
bytes = "1.12"
tokio = { version = "1.53", features = ["macros", "rt", "signal", "time"] }

[lints]
workspace = true
