[package]
name = "yuke-engine"
version = "0.0.1-dev"
description = "Conversation execution through model and tool calls."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
fastrand = "2.5.0"
serde = "1.0.229"
serde_json = "1.0.151"
tokio-util = "0.7.19"
yuke-ai = { path = "../ai", default-features = false }

[dev-dependencies]
bytes = "1.12"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53", features = ["macros", "rt", "signal", "time"] }
yuke-ai = { path = "../ai", features = ["http-tokio"] }

[lints]
workspace = true
