[package]
name = "yuke-mcp"
version = "0.0.1-dev"
description = "The MCP client of yuke: the servers of a session and their tools."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
# The version that rmcp uses: a session of its own for each server.
process-wrap = { version = "10.0.1", default-features = false, features = ["process-session", "tokio1"] }
# rmcp makes breaking releases often, so the crate pins one exact version.
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-child-process"] }
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53", features = ["io-util", "macros", "process", "rt", "sync"] }
yuke-ai = { path = "../ai", default-features = false }
yuke-engine = { path = "../engine" }
yuke-protocol = { path = "../protocol" }

[features]
# Builds the MCP server of the tests, so a plain build of the crate leaves it out.
test-server = []

# The MCP server of the tests. It speaks just enough of the protocol, so the tests need no other server.
[[bin]]
name = "yuke-mcp-test-server"
path = "test-server/main.rs"
test = false
doc = false
required-features = ["test-server"]

[[test]]
name = "servers"
required-features = ["test-server"]

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "process", "rt", "sync", "time"] }
yuke-testing = { path = "../testing" }

[lints]
workspace = true
